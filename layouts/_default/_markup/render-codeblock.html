<div class="code-block">
  <div class="code-header">
    <div class="code-dots">
      <span class="dot dot-red"></span>
      <span class="dot dot-yellow"></span>
      <span class="dot dot-green"></span>
    </div>
    {{ with .Type }}<span class="code-lang">{{ . }}</span>{{ end }}
  </div>
  <pre class="line-numbers"><code class="language-{{ .Type | default "text" }}">{{ .Inner }}</code></pre>
</div>
