{{ define "main" }}
<section class="error-page">
    <div class="error-box">
        <h1 class="error-code">404</h1>
        <p class="error-msg">PAGE NOT FOUND</p>
        <p class="error-desc">요청하신 페이지를 찾을 수 없습니다.</p>
        <a href="/" class="error-home">&#9654; HOME</a>
    </div>
</section>

<style>
.error-page {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 60vh;
    text-align: center;
}
.error-box {
    border: 2px solid var(--accent);
    padding: 3rem 4rem;
    background: var(--card-bg);
}
.error-code {
    font-family: 'Galmuri11', monospace;
    font-size: 6rem;
    color: var(--accent);
    margin: 0;
    line-height: 1;
    text-shadow: 0 0 20px var(--accent);
}
.error-msg {
    font-family: 'Galmuri11', monospace;
    font-size: 1.5rem;
    color: var(--text);
    margin: 0.5rem 0 1rem;
    letter-spacing: 0.2em;
}
.error-desc {
    color: var(--text-secondary, #888);
    margin-bottom: 2rem;
}
.error-home {
    font-family: 'Galmuri11', monospace;
    color: var(--accent);
    text-decoration: none;
    border: 1px solid var(--accent);
    padding: 0.5rem 1.5rem;
    transition: all 0.2s;
}
.error-home:hover {
    background: var(--accent);
    color: var(--bg);
}
</style>
{{ end }}
