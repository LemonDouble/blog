      - name: "claude-slack-bridge"
        slug: "claude-slack-bridge"
        private: false
        tagline: "Claude Code ↔ Slack 양방향 브릿지 MCP 서버"
        languages: ["Python"]
        status: "완료"
        description: |
          Claude Code한테 일 시켜놓고 자리 비울 때 쓰려고 만든 MCP 서버입니다.

          원본에서 꽤 많이 확장했는데, 주요 기능은 이렇습니다:

          - **MCP 도구 4종**: `ask_on_slack`(질문 보내고 답변 대기), `notify_on_slack`(알림만 보내기), `upload_to_slack`(파일 업로드), `download_slack_file`(Slack 첨부파일 다운로드)
          - **Slack → Claude**: Slack에서 봇 멘션하면 프로젝트 목록이 뜨고, 선택하면 해당 프로젝트에서 Claude 세션이 시작됩니다. 새 프로젝트 생성도 Slack에서 바로 가능.
          - **실시간 진행상황**: Claude가 Read, Edit, Bash 같은 도구를 쓸 때마다 Slack 메시지가 실시간으로 업데이트됩니다.
          - **메시지 큐잉**: 클로드 작업중일 때 슬랙 쓰레드로 메시지 달아놓으면, 작업 끝나는 대로 나머지 이어서 처리합니다.
          - **이모지 리액션으로 취소**: ❌ 리액션 달면 작업이 중단됩니다.
          - **모델/effort 설정**: 스레드 내 명령어로 모델(sonnet/opus/haiku)과 effort 레벨을 변경할 수 있고, 글로벌 기본값도 저장 가능합니다.
          - **토큰 사용량 표시**: 응답 완료 시 모델명, 토큰 수, 캐시 히트율, 비용, 소요 시간을 자동으로 보여줍니다.
        url: "https://github.com/LemonDouble/claude-slack-bridge"
        fork_of: "tomeraitz/claude-slack-bridge"

