      - name: "lemon-design-system"
        slug: "lemon-design-system"
        private: false
        tagline: "AI 智能体友好的个人设计系统"
        languages: ["CSS"]
        status: "완료"
        description: |
          我在 GeekNews（韩国技术资讯网站）上看到了 [awesome-design-md](https://github.com/VoltAgent/awesome-design-md)，虽然把别人网站的设计扒下来作为预设来提供这件事我并不喜欢，但「AI 可以拥有一致的设计系统」这个想法本身我觉得很不错。

          因为我做的项目本来就比较多，所以我一直希望能拥有一套自己的设计系统，让人一眼看到设计就能知道：啊，这是 LemonDouble 的项目！

          我之前确实找过认识的设计师朋友用 Figma 外包过，但是……毕竟我是服务器开发者，有些东西实现起来挺难的，而且每个项目都需要不断新增组件，总不能每次都去找设计师外包，所以一直都没能真正应用起来。

          但有了这个方法论之后，我觉得也许真的可以做到了，于是从我 favicon 的 logo 出发，提取出 Primary / Secondary 颜色，然后调整每种颜色的饱和度和明度，做出方案后用眼睛检查、不断修改直到满意为止。

          从博客开始，我把它应用到了所有前端页面上。

          效果还挺不错的。
        url: "https://github.com/LemonDouble/lemon-design-system"

      - name: "hayakoe"
        slug: "hayakoe"
        private: false
        tagline: "ONNX 优化的日语 TTS 库"
        languages: ["Python"]
        status: "완료"
        description: |
          在 TTS 领域有一条 [Bert-VITS](https://github.com/fishaudio/Bert-VITS2) → [Style-Bert-VITS2](https://github.com/litagin02/Style-Bert-VITS2) 的脉络。

          Bert-VITS 是 Fish-Speech 团队的旧模型，现在他们已经转向 autoregression 方式的 Fish-Speech 仓库，原仓库的更新就停了。

          在此基础上加入了 style 相关的 layer，并用更多的日语数据训练，提供日语强化的 Pretrained 模型，这就是 Style-Bert-VITS2 仓库。

          此外还有一些其他的改进。

          但是 Style-Bert-VITS2 的更新也已经停了大概 8 个月了……反正都停更了，我想趁这个机会整理一下代码，让它用起来更顺手，于是就开始做这个项目了。

          #### 已实现内容

          - 由于 pyopenjtalk-prebuilt 库已停更，无法在 Python 3.12 以上版本使用，于是我把那个仓库 fork 出来，修改成最新版本也能构建的 lemon-pyopenjtalk-prebuilt 库，并替换掉了原依赖
          - 修复了 TTS 文本中包含英文时会被处理为静音的问题。利用 [loanwords_gairaigo](https://github.com/jamesohortle/loanwords_gairaigo) 数据自动支持约 22 万条 英文→片假名 映射，并简化了自定义词典注册功能
          - 对 BERT 权重进行动态量化，内存占用减少约 50%
          - 把 Synthesizer 用 ONNX 优化，CPU 推理速度提升约 1.6 倍
          - 把 BERT / Synthesizer 模型加载分离开来，BERT 共享使用，每个说话人只单独加载对应的 Synthesizer，使每个说话人只占用约 200MB 内存
          - 发布到 PyPI，`pip install hayakoe` 后只需 3 行代码就能直接使用
          - 在仅 CPU 环境下不需要安装 PyTorch，仅靠 ONNX Runtime 也能推理，改造为双后端架构
          - 支持按句子粒度的流式 TTS（`stream()`）。不再一次性处理长文本，而是逐句顺序生成，可用于实时响应
          - `generate()` 自动把长文本按句子分割处理，速度提升约 37 倍（以 400 字为基准从 143 秒缩短到 3.8 秒）
          - 通过 `weight_norm` → `parametrizations.weight_norm` 的迁移确保 PyTorch 2.x+ 的兼容性

          #### 实现中内容

          - 正在实现一条预处理流水线，可以从想要提取数据的视频中自动生成训练数据。视频上传 → 提取音频 → 分离背景音 → Whisper 生成字幕 → 自动构建数据集，全流程一气呵成
          - 正在实现一个交互式训练 CLI，从数据集预处理到模型训练、再到生成质量报告，可以一条龙完成
        url: "https://github.com/LemonDouble/hayakoe"

