      - name: "claude-slack-bridge"
        slug: "claude-slack-bridge"
        private: false
        tagline: "Claude Code ↔ Slack 双向桥接 MCP 服务器"
        languages: ["Python"]
        status: "완료"
        description: |
          这是一个为了在让 Claude Code 干活、自己暂时离开座位时使用而做的 MCP 服务器。

          相比原版做了相当多的扩展，主要功能如下：

          - **4 种 MCP 工具**：`ask_on_slack`（发送问题并等待回答）、`notify_on_slack`（仅发送通知）、`upload_to_slack`（文件上传）、`download_slack_file`（下载 Slack 附件）
          - **Slack → Claude**：在 Slack 中 mention 机器人，会显示项目列表，选择后会在该项目下开启 Claude 会话。也可以直接在 Slack 中创建新项目。
          - **实时进度**：每当 Claude 调用 Read、Edit、Bash 等工具时，Slack 消息会实时更新。
          - **消息排队**：在 Claude 工作期间往 Slack 线程留消息，工作结束后会自动接着处理剩下的内容。
          - **通过表情反应取消**：加上 ❌ 反应可以中断工作。
          - **模型/effort 设置**：可以在线程内通过命令切换模型（sonnet/opus/haiku）和 effort 等级，也可以保存全局默认值。
          - **token 用量显示**：响应完成后会自动显示模型名、token 数、缓存命中率、费用、耗时。
        url: "https://github.com/LemonDouble/claude-slack-bridge"
        fork_of: "tomeraitz/claude-slack-bridge"

