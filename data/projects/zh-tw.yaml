      - name: "lemon-design-system"
        slug: "lemon-design-system"
        private: false
        tagline: "對 AI agent 友善的個人設計系統"
        languages: ["CSS"]
        status: "완료"
        description: |
          我在 GeekNews（韓國技術資訊網站）上看到了 [awesome-design-md](https://github.com/VoltAgent/awesome-design-md)，雖然我不喜歡把其他網站的設計拆下來當作預設提供的做法，但「讓 AI 擁有一致設計系統」這個想法本身我覺得很棒。

          我本來就會做許多專案，所以一直希望能擁有自己的設計系統，讓人光看設計就能認出「啊這是 LemonDouble 的專案！」。

          因此我曾實際委託認識的設計師用 Figma 接案製作過，但.. 我畢竟是伺服器開發者.. 有些東西實作起來很困難，而且每個專案都會持續需要新元件，總不可能每次都委外，所以一直沒能真正套用。

          但這個方法論也許可行，於是我從自己 favicon 的 logo 開始，先抽出 Primary / Secondary 顏色，再針對各色調整彩度／明度產出多個草稿，肉眼一張張檢視並反覆調整到滿意為止。

          從部落格到所有有前端頁面的地方都套用了。

          結果還挺不錯的。
        url: "https://github.com/LemonDouble/lemon-design-system"

      - name: "hayakoe"
        slug: "hayakoe"
        private: false
        tagline: "ONNX 最佳化的日語 TTS 函式庫"
        languages: ["Python"]
        status: "완료"
        description: |
          TTS 領域有 [Bert-VITS](https://github.com/fishaudio/Bert-VITS2) → [Style-Bert-VITS2](https://github.com/litagin02/Style-Bert-VITS2) 這條譜系。

          Bert-VITS 是 Fish-Speech 團隊以前的模型，現在他們已經轉向 autoregression 方式的 Fish-Speech 倉庫，那邊的更新就停了。

          在這之上加一層 style 相關的 layer、訓練更多日語資料以提供日語強化的 Pretrained 模型，就是 Style-Bert-VITS2 的倉庫。

          另外還做了各種改進。

          但 Style-Bert-VITS2 的函式庫更新大概在八個月前就停了.. 既然已經停了，乾脆趁機整理一下程式碼，讓它更好用，所以我就動手做做看。

          #### 已完成的內容

          - pyopenjtalk-prebuilt 函式庫已經停止更新，在 Python 3.12 以上無法使用。我把它 fork 出來修改成最新版也可以建置的 lemon-pyopenjtalk-prebuilt 函式庫並改用之
          - 修正 TTS 文字中若包含英文會被當成靜音處理的問題。利用 [loanwords_gairaigo](https://github.com/jamesohortle/loanwords_gairaigo) 的資料自動支援約 22 萬個英文→片假名映射，並簡化自訂字典登錄功能
          - 對 BERT weight 進行動態量化，記憶體使用量約減少 50%
          - 把 Synthesizer 透過 ONNX 最佳化，在 CPU 上達成約 1.6 倍的速度提升
          - 將 BERT 與 Synthesizer 模型載入分離，讓 BERT 可被共用，每個說話者只需另外載入 Synthesizer，做到每位說話者只需約 200MB 記憶體
          - 發布為 PyPI 套件，整理成 `pip install hayakoe` 後 3 行程式碼即可使用
          - 在純 CPU 環境下無需安裝 PyTorch，僅靠 ONNX Runtime 即可推論，改為雙後端結構
          - 支援句子級的串流 TTS（`stream()`）。不需要一次處理整段長文字，而是按句逐一生成，可用於即時回應
          - `generate()` 對長文字自動以句子為單位分割處理，速度提升約 37 倍（400 字基準 143 秒 → 3.8 秒）
          - 將 `weight_norm` 遷移為 `parametrizations.weight_norm`，確保 PyTorch 2.x+ 的相容性

          #### 開發中的內容

          - 正在實作預處理流水線，將想抽取資料的影片自動轉成訓練資料。影片上傳 → 抽取音訊 → 分離背景音 → Whisper 字幕生成 → 自動建立資料集，全程一條龍
          - 正在實作互動式訓練 CLI，可從資料集預處理、模型訓練到品質報告生成全部一條龍進行
        url: "https://github.com/LemonDouble/hayakoe"

