      - name: "claude-slack-bridge"
        slug: "claude-slack-bridge"
        private: false
        tagline: "Claude Code ↔ Slack 雙向橋接 MCP 伺服器"
        languages: ["Python"]
        status: "완료"
        description: |
          這是為了讓 Claude Code 在做事的時候我能離開座位而做的 MCP 伺服器。

          相比原本擴展了不少，主要功能如下：

          - **MCP 工具 4 種**：`ask_on_slack`（送出問題並等待回答）、`notify_on_slack`（只送通知）、`upload_to_slack`（上傳檔案）、`download_slack_file`（下載 Slack 附件）
          - **Slack → Claude**：在 Slack 中 mention bot 後會列出專案清單，選擇後就會在該專案啟動 Claude session。也可以直接在 Slack 中建立新專案。
          - **即時進度**：Claude 每次使用 Read、Edit、Bash 等工具時，Slack 訊息都會即時更新。
          - **訊息排隊**：Claude 在工作時若在 Slack 討論串裡留言，等工作結束後就會接著處理剩下的內容。
          - **以 emoji 反應取消**：加上 ❌ 反應就會中斷工作。
          - **模型／effort 設定**：可透過 thread 內指令變更模型（sonnet/opus/haiku）與 effort 等級，全域預設值也能保存。
          - **顯示 token 使用量**：回覆完成時會自動顯示模型名稱、token 數量、cache 命中率、費用、耗時。
        url: "https://github.com/LemonDouble/claude-slack-bridge"
        fork_of: "tomeraitz/claude-slack-bridge"

