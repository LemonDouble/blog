      - name: "claude-slack-bridge"
        slug: "claude-slack-bridge"
        private: false
        tagline: "Claude Code ↔ Slack双方向ブリッジMCPサーバー"
        languages: ["Python"]
        status: "완료"
        description: |
          Claude Codeに作業をさせて席を外すときに使うために作ったMCPサーバーです。

          オリジナルからかなり拡張しましたが、主な機能は以下の通りです:

          - **MCPツール4種**: `ask_on_slack`(質問を送り回答を待機)、`notify_on_slack`(通知のみ送信)、`upload_to_slack`(ファイルアップロード)、`download_slack_file`(Slack添付ファイルのダウンロード)
          - **Slack → Claude**: Slackでボットをメンションするとプロジェクト一覧が表示され、選択するとそのプロジェクトでClaudeセッションが始まります。新規プロジェクト作成もSlackから直接可能。
          - **リアルタイム進捗**: ClaudeがRead、Edit、Bashなどのツールを使うたびにSlackメッセージがリアルタイムで更新されます。
          - **メッセージキューイング**: Claudeが作業中の時にSlackスレッドにメッセージを残しておくと、作業が終わり次第続けて処理します。
          - **絵文字リアクションでキャンセル**: ❌リアクションをつけると作業が中断されます。
          - **モデル/effort設定**: スレッド内コマンドでモデル(sonnet/opus/haiku)とeffortレベルを変更でき、グローバルなデフォルト値も保存可能です。
          - **トークン使用量表示**: 応答完了時にモデル名、トークン数、キャッシュヒット率、費用、所要時間を自動的に表示します。
        url: "https://github.com/LemonDouble/claude-slack-bridge"
        fork_of: "tomeraitz/claude-slack-bridge"

