      - name: "lemon-design-system"
        slug: "lemon-design-system"
        private: false
        tagline: "AIエージェントフレンドリーな個人デザインシステム"
        languages: ["CSS"]
        status: "완료"
        description: |
          [awesome-design-md](https://github.com/VoltAgent/awesome-design-md)をGeekNews (韓国の技術ニュースサイト)で見たのですが、他のウェブサイトのデザインを抜き出してプリセットとして提供するという点は気に入らないものの.. AIが一貫したデザインシステムを持てるというアイデア自体は良いと思いました。

          もともと色々なプロジェクトをやっていると、自分だけのデザインシステムで、デザインを見るだけで「あ、LemonDoubleのプロジェクトだ!」と分かるようにしたいという考えがありました。

          そこで実際に知り合いのデザイナーさんにFigmaで外注したこともあったのですが.. 私はあくまでサーバー開発者なので.. 実装が難しい部分もあり、プロジェクトごとにコンポーネントが必要になるたびにデザイナーさんに外注するわけにもいかず、適用できずにいたんです。

          ところがこの方法論ならいけるかもしれないと思い、私のfaviconのロゴを起点にPrimary / Secondaryカラーを抽出した後、各色ごとに彩度/明度を調整しながら案を出し、目で検証しながら気に入るまで修正して作ってみました。

          ブログをはじめ、フロントが立ち上がっているすべてのページに適用しました。

          うまくいきましたね。
        url: "https://github.com/LemonDouble/lemon-design-system"

      - name: "hayakoe"
        slug: "hayakoe"
        private: false
        tagline: "ONNX最適化された日本語TTSライブラリ"
        languages: ["Python"]
        status: "완료"
        description: |
          TTS分野には[Bert-VITS](https://github.com/fishaudio/Bert-VITS2) → [Style-Bert-VITS2](https://github.com/litagin02/Style-Bert-VITS2)という系譜があります。

          Bert-VITSはFish-Speechチームの以前のモデルで、現在はautoregression方式のFish-Speechリポジトリに更新が移ったため、リポジトリの更新が止まっています。

          ここにstyle関連のlayerを一つ加え、日本語データをより多く学習させて日本語強化のPretrainedモデルを提供しているのがStyle-Bert-VITS2リポジトリです。

          加えて様々な改善が入っていました。

          ところがStyle-Bert-VITS2ライブラリの更新が8ヶ月ほど前に止まってしまったので.. どうせ更新が止まっているなら、コード整理を一度行ってより使いやすくしたいと思って作業しています。

          #### 実装完了した内容

          - pyopenjtalk-prebuiltライブラリの更新が止まり、Python 3.12以上で使えない問題を、当該リポジトリをフォークして最新バージョンでもビルドできるよう修正したlemon-pyopenjtalk-prebuiltライブラリへ変更
          - TTSテキスト内に英語が入ると無音になる問題を修正。[loanwords_gairaigo](https://github.com/jamesohortle/loanwords_gairaigo)データを活用して約22万件の英語→カタカナマッピングを自動サポートし、カスタム辞書登録機能を簡素化
          - BERT weightをダイナミック量子化することで、メモリ使用量を約50%削減
          - SynthesizerをONNXで最適化し、CPUで約1.6倍の速度向上を達成
          - BERT / Synthesizerモデルのロードを分離し、BERTは共通で使い、話者ごとに異なるSynthesizerだけを別途ロードするようにすることで、話者一つあたり200MB程度のメモリのみで済むよう改善
          - PyPIパッケージとして公開し、`pip install hayakoe`後に3行のコードですぐ使えるよう整理
          - CPU専用環境ではPyTorchのインストールなしにONNX Runtimeのみで推論可能なデュアルバックエンド構造へ変更
          - 文単位ストリーミングTTS(`stream()`)対応。長いテキストを一度に処理せず文ごとに順次生成し、リアルタイム応答に活用可能
          - `generate()`で長いテキストを自動的に文単位に分割処理し、約37倍の速度向上(400文字基準143秒 → 3.8秒)
          - `weight_norm` → `parametrizations.weight_norm`への移行でPyTorch 2.x+互換性を確保

          #### 実装中の内容

          - データ抽出したい動画から学習データを自動生成する前処理パイプラインを実装中。動画アップロード → 音声抽出 → 背景音分離 → Whisper字幕生成 → データセット自動構成までを一連の流れで処理
          - データセットの前処理からモデル学習、品質レポート生成までを一連の流れで進められるインタラクティブ学習CLIを実装中
        url: "https://github.com/LemonDouble/hayakoe"

