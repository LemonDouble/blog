          description: "Hugoのバージョンを上げたら動いていたものが動かなくなったので.. 直しました。"
        - repo: "Jaydee94/kubeseal-webgui"
          pr: "https://github.com/Jaydee94/kubeseal-webgui/pull/278"
          pr_number: 278
          description: "便利に使っていたのですが、Secretのクリップボードコピーができなくなっていたので.. 直しました。"
    - year: 2024
      items:
        - repo: "opensearch-project/helm-charts"
          pr: "https://github.com/opensearch-project/helm-charts/pull/618"
          pr_number: 618
          description: "Helmでバージョンを上げたらデプロイできなくなったので調べたら、デフォルトのopensearch.ymlがsecurity pluginと衝突していました。"
    - year: 2023
      items:
